# Public ATS tenants verified against their unauthenticated endpoints on 2026-07-21.
# Phase 3.2 audit (2026-08-03, ingestion run f4020aec) re-verified every tenant against
# its public endpoint. One entry was removed: recruitee/xebiapoland returned a
# deterministic HTTP 404 both during ingestion and on direct verification, and no
# replacement board could be verified.
#
# Thirteen tenants (greenhouse gitlab/grafanalabs/elastic/cloudflare/datadog/canonical/
# twilio, lever weloglobal/veeva, ashby cohere/elevenlabs, recruitee transperfect/tether)
# failed with RESPONSE_PARSE_ERROR "response exceeded the configured size limit". Those
# boards are live and reachable; they exceed `jobpilot.http.max-response-bytes`, which
# this profile raises to 10 MiB while the default in application.yml is 2 MiB. They are
# deliberately retained: the limit is a client-side setting, not a dead tenant.
#
# This profile is intentionally opt-in: --spring.profiles.active=development
jobpilot:
  # No http override: application.yml now defaults to the same 10 MiB bound, so this
  # profile no longer needs to raise it for the large boards listed below.
  sources:
    greenhouse-board-tokens:
      - gitlab
      - grafanalabs
      - elastic
      - cloudflare
      - datadog
      - canonical
      - twilio
      - yesenergy
      - thepacgroup
      - algolia
      # Phase 3.3A: Bucharest-relevant additions verified against their public boards.
      - scbitdefendersrl
      - showpad
    lever-company-ids:
      - swissborg
      - collabora
      - swapcard
      - whereby
      - weloglobal
      - veeva
    ashby-board-names:
      - Ashby
      - langchain
      - n8n
      - enode
      - linear
      - supabase
      - posthog
      - gitbook
      - deepgram
      - temporal
      - clickhouse
      - airbyte
      - render
      - incident
      - cursor
      - notion
      - cohere
      - elevenlabs
      - qonto
      - attio
      - pleo
      - runway
      # Phase 3.3A: Bucharest-founded, large Romanian engineering organisation.
      - uipath
    recruitee-company-ids:
      - transperfect
      - tether
      - auditdata
      - moneyhash
      - veocareers
      - aidigital
      - almavivadebelgique
    # Activated by the Phase 3.3D controlled live validation (run c7643227). Both
    # companies answered the public Posting API and each contributed a REVIEW role;
    # AECOM2 supplied a Bucharest-local ENTRY_LEVEL vacancy. Ubisoft2, Endava, and
    # Gameloft are deliberately absent: each returned a deterministic
    # RESPONSE_PARSE_ERROR and stays on hold pending investigation, not activation.
    smartrecruiters-company-identifiers:
      - BoschGroup
      - AECOM2
