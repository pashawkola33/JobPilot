# Production stack for the Azure Linux VM. See docs/server-migration-runbook.md.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Configuration comes from /opt/jobpilot/.env (mode 600), which Compose loads
# automatically from the working directory. This file contains no secret and no
# environment-specific identifier, and is safe to commit.
#
# The image is never built here. It is published by .github/workflows/ci.yml and
# pinned to an immutable commit SHA through JOBPILOT_IMAGE_TAG.

name: jobpilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - jobpilot-postgres:/var/lib/postgresql/data
    # No `ports:` on purpose. PostgreSQL is reachable only over the internal
    # network; psql and pg_dump run through `docker compose exec`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - database

  app:
    image: ghcr.io/pashawkola33/jobpilot:${JOBPILOT_IMAGE_TAG:?set JOBPILOT_IMAGE_TAG to a published commit SHA}
    pull_policy: always
    # Single instance. The scheduler and the Telegram long poller are in-process
    # singletons; a second replica would double-fetch and race on getUpdates.
    deploy:
      replicas: 1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # Baked into the image by the release workflow. Declared without a value so an
      # unset host variable leaves the real build identity visible on /health.
      JOBPILOT_VERSION:
      BUILD_COMMIT:

      # Ingestion and delivery start disabled. They are enabled only at the cutover
      # step of the runbook, and only once the Mac app is confirmed stopped.
      JOBPILOT_SCHEDULING_ENABLED: ${JOBPILOT_SCHEDULING_ENABLED:-false}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_COMMANDS_ENABLED: ${TELEGRAM_COMMANDS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_MATCH_NOTIFICATIONS_ENABLED: ${TELEGRAM_MATCH_NOTIFICATIONS_ENABLED:-true}
      TELEGRAM_REVIEW_DIGEST_ENABLED: ${TELEGRAM_REVIEW_DIGEST_ENABLED:-true}
      TELEGRAM_DISCARD_PENDING_ON_FIRST_START: ${TELEGRAM_DISCARD_PENDING_ON_FIRST_START:-true}

      GREENHOUSE_BOARD_TOKENS: ${GREENHOUSE_BOARD_TOKENS:-}
      LEVER_COMPANY_IDS: ${LEVER_COMPANY_IDS:-}
      ASHBY_BOARD_NAMES: ${ASHBY_BOARD_NAMES:-}
      RECRUITEE_COMPANY_IDS: ${RECRUITEE_COMPANY_IDS:-}
      SMARTRECRUITERS_COMPANY_IDENTIFIERS: ${SMARTRECRUITERS_COMPANY_IDENTIFIERS:-}
      WORKDAY_CAREER_SITES: ${WORKDAY_CAREER_SITES:-}
      JOB_FETCH_CRON: ${JOB_FETCH_CRON:-0 0 */6 * * *}
      DAILY_DIGEST_CRON: ${DAILY_DIGEST_CRON:-0 0 9 * * *}
      STALE_DAYS: ${STALE_DAYS:-30}

      # Post-migration phases. Never enabled during a migration window.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      SCRAPER_WORKER_ENABLED: ${SCRAPER_WORKER_ENABLED:-false}
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-false}
      DOCUMENT_STORAGE_ROOT: /var/lib/jobpilot/documents

      # One-shot guarded commands. Mode and write capability are independently
      # default-off; guards are supplied per run, to a temporary process, never here.
      JOBPILOT_SCORE_RESCORE_PREVIEW_ENABLED: ${JOBPILOT_SCORE_RESCORE_PREVIEW_ENABLED:-false}
      JOBPILOT_SCORE_RESCORE_COMMAND_MODE: ${JOBPILOT_SCORE_RESCORE_COMMAND_MODE:-OFF}
      JOBPILOT_SCORE_RESCORE_WRITE_ENABLED: ${JOBPILOT_SCORE_RESCORE_WRITE_ENABLED:-false}
      JOBPILOT_SOURCE_LOG_CLEANUP_MODE: ${JOBPILOT_SOURCE_LOG_CLEANUP_MODE:-OFF}
      JOBPILOT_SOURCE_LOG_CLEANUP_WRITE_ENABLED: ${JOBPILOT_SOURCE_LOG_CLEANUP_WRITE_ENABLED:-false}
    volumes:
      - jobpilot-documents:/var/lib/jobpilot/documents
    read_only: true
    tmpfs:
      - /tmp/jobpilot:rw,noexec,nosuid,size=134217728,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Loopback only. Reach it with `ssh -N -L 8080:127.0.0.1:8080 jobpilot@<vm>`.
    # Docker bypasses ufw when publishing, so this prefix is the actual boundary.
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Matches spring.lifecycle.timeout-per-shutdown-phase (20s) plus headroom, so
    # in-flight fetches and Telegram sends finish instead of being killed.
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - database

volumes:
  # Never recreated, never removed. `docker compose down -v` is forbidden.
  jobpilot-postgres:
  jobpilot-documents:

networks:
  database:
    driver: bridge
