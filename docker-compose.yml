services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
    volumes:
      - jobpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - database

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobpilot}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      JOBPILOT_VERSION: ${JOBPILOT_VERSION:-unknown}
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_COMMANDS_ENABLED: ${TELEGRAM_COMMANDS_ENABLED:-false}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_MATCH_NOTIFICATIONS_ENABLED: ${TELEGRAM_MATCH_NOTIFICATIONS_ENABLED:-true}
      TELEGRAM_REVIEW_DIGEST_ENABLED: ${TELEGRAM_REVIEW_DIGEST_ENABLED:-true}
      TELEGRAM_MAX_JOBS_PER_MESSAGE: ${TELEGRAM_MAX_JOBS_PER_MESSAGE:-5}
      TELEGRAM_MAX_NOTE_LENGTH: ${TELEGRAM_MAX_NOTE_LENGTH:-500}
      TELEGRAM_POLLING_TIMEOUT_SECONDS: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:-25}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-25s}
      TELEGRAM_POLL_DELAY: ${TELEGRAM_POLL_DELAY:-2s}
      TELEGRAM_POLL_LIMIT: ${TELEGRAM_POLL_LIMIT:-50}
      TELEGRAM_MAX_UPDATE_FAILURES: ${TELEGRAM_MAX_UPDATE_FAILURES:-3}
      TELEGRAM_DISCARD_PENDING_ON_FIRST_START: ${TELEGRAM_DISCARD_PENDING_ON_FIRST_START:-true}
      JOBPILOT_TELEGRAM_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      JOBPILOT_TELEGRAM_COMMANDS_ENABLED: ${TELEGRAM_COMMANDS_ENABLED:-false}
      JOBPILOT_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      JOBPILOT_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      JOBPILOT_TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      JOBPILOT_TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      JOBPILOT_TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      JOBPILOT_TELEGRAM_DISCARD_PENDING_ON_FIRST_START: ${TELEGRAM_DISCARD_PENDING_ON_FIRST_START:-false}
      GREENHOUSE_BOARD_TOKENS: ${GREENHOUSE_BOARD_TOKENS:-}
      LEVER_COMPANY_IDS: ${LEVER_COMPANY_IDS:-}
      ASHBY_BOARD_NAMES: ${ASHBY_BOARD_NAMES:-}
      RECRUITEE_COMPANY_IDS: ${RECRUITEE_COMPANY_IDS:-}
      SMARTRECRUITERS_COMPANY_IDENTIFIERS: ${SMARTRECRUITERS_COMPANY_IDENTIFIERS:-}
      JOB_FETCH_CRON: ${JOB_FETCH_CRON:-0 0 */6 * * *}
      DAILY_DIGEST_CRON: ${DAILY_DIGEST_CRON:-0 0 9 * * *}
      STALE_DAYS: ${STALE_DAYS:-30}
      MANUAL_URL_CONNECT_TIMEOUT: ${MANUAL_URL_CONNECT_TIMEOUT:-5s}
      MANUAL_URL_RESPONSE_TIMEOUT: ${MANUAL_URL_RESPONSE_TIMEOUT:-15s}
      MANUAL_URL_MAX_REDIRECTS: ${MANUAL_URL_MAX_REDIRECTS:-3}
      JOBPILOT_HTTP_MAX_RESPONSE_BYTES: ${JOBPILOT_HTTP_MAX_RESPONSE_BYTES:-10485760}
      MANUAL_URL_MAX_RESPONSE_BYTES: ${MANUAL_URL_MAX_RESPONSE_BYTES:-1048576}
      MANUAL_URL_MAX_TITLE_LENGTH: ${MANUAL_URL_MAX_TITLE_LENGTH:-500}
      MANUAL_URL_MAX_DESCRIPTION_LENGTH: ${MANUAL_URL_MAX_DESCRIPTION_LENGTH:-100000}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CONNECT_TIMEOUT: ${LLM_CONNECT_TIMEOUT:-5s}
      LLM_RESPONSE_TIMEOUT: ${LLM_RESPONSE_TIMEOUT:-60s}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_REQUEST_BUDGET_USD: ${LLM_REQUEST_BUDGET_USD:-}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-}
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-}
      LLM_INPUT_COST_PER_MILLION_TOKENS: ${LLM_INPUT_COST_PER_MILLION_TOKENS:-}
      LLM_OUTPUT_COST_PER_MILLION_TOKENS: ${LLM_OUTPUT_COST_PER_MILLION_TOKENS:-}
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      DOCUMENT_STORAGE_ROOT: /var/lib/jobpilot/documents
      DOCUMENT_MAX_DOCX_BYTES: ${DOCUMENT_MAX_DOCX_BYTES:-2097152}
      DOCUMENT_MAX_PDF_BYTES: ${DOCUMENT_MAX_PDF_BYTES:-2097152}
      DOCUMENT_RESUME_TEMPLATE_VERSION: ${DOCUMENT_RESUME_TEMPLATE_VERSION:-resume-v1}
      DOCUMENT_COVER_NOTE_TEMPLATE_VERSION: ${DOCUMENT_COVER_NOTE_TEMPLATE_VERSION:-cover-note-v1}
      DOCUMENT_RENDERER_VERSION: ${DOCUMENT_RENDERER_VERSION:-apache-v1}
      DOCUMENT_MAX_PREVIEW_CHARACTERS: ${DOCUMENT_MAX_PREVIEW_CHARACTERS:-4000}
      DOCUMENT_STALE_AFTER: ${DOCUMENT_STALE_AFTER:-10m}
      DOCUMENT_CONTACT_CACHE_HMAC_KEY: ${DOCUMENT_CONTACT_CACHE_HMAC_KEY:-}
      DOCUMENT_CONTACT_EMAIL: ${DOCUMENT_CONTACT_EMAIL:-}
      DOCUMENT_CONTACT_PHONE: ${DOCUMENT_CONTACT_PHONE:-}
      DOCUMENT_CONTACT_GITHUB_URL: ${DOCUMENT_CONTACT_GITHUB_URL:-}
      DOCUMENT_CONTACT_LINKEDIN_URL: ${DOCUMENT_CONTACT_LINKEDIN_URL:-}
      DOCUMENT_CONTACT_PORTFOLIO_URL: ${DOCUMENT_CONTACT_PORTFOLIO_URL:-}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-false}
      MAINTENANCE_INTERVAL: ${MAINTENANCE_INTERVAL:-15m}
      MAINTENANCE_MAX_ITEMS_PER_RUN: ${MAINTENANCE_MAX_ITEMS_PER_RUN:-100}
      MAINTENANCE_MAX_DURATION_PER_RUN: ${MAINTENANCE_MAX_DURATION_PER_RUN:-30s}
      MAINTENANCE_ORPHAN_GRACE_PERIOD: ${MAINTENANCE_ORPHAN_GRACE_PERIOD:-1h}
      SCRAPER_WORKER_ENABLED: ${SCRAPER_WORKER_ENABLED:-false}
      SCRAPER_WORKER_BASE_URL: ${SCRAPER_WORKER_BASE_URL:-http://scraper-worker:3000}
      SCRAPER_WORKER_SHARED_SECRET: ${SCRAPER_WORKER_SHARED_SECRET:-}
      SCRAPER_WORKER_CONNECT_TIMEOUT: ${SCRAPER_WORKER_CONNECT_TIMEOUT:-5s}
      SCRAPER_WORKER_RESPONSE_TIMEOUT: ${SCRAPER_WORKER_RESPONSE_TIMEOUT:-45s}
      SCRAPER_WORKER_MAX_RESPONSE_BYTES: ${SCRAPER_WORKER_MAX_RESPONSE_BYTES:-1048576}
      SCRAPER_WORKER_MAX_DESCRIPTION_CHARACTERS: ${SCRAPER_WORKER_MAX_DESCRIPTION_CHARACTERS:-50000}
    volumes:
      - jobpilot-documents:/var/lib/jobpilot/documents
    read_only: true
    tmpfs:
      - /tmp/jobpilot:rw,noexec,nosuid,size=134217728,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - database
      - scraper-egress

  # Optional JavaScript-rendering fallback worker. Started only with the
  # "scraper" profile: `docker compose --profile scraper up`. It has no host
  # port and is reachable only over the internal Compose network.
  scraper-worker:
    profiles: ["scraper"]
    build:
      context: ./scraper-worker
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      SCRAPER_WORKER_SHARED_SECRET: ${SCRAPER_WORKER_SHARED_SECRET:-}
      WORKER_MAX_CONCURRENT_RENDERS: ${WORKER_MAX_CONCURRENT_RENDERS:-1}
      WORKER_MAX_SEARCH_RESULTS: ${WORKER_MAX_SEARCH_RESULTS:-50}
    expose:
      - "3000"
    init: true
    cpus: "1.00"
    mem_limit: 1073741824
    mem_reservation: 268435456
    pids_limit: 256
    shm_size: 268435456
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    read_only: true
    tmpfs:
      # Chromium writes its user-data dir and maps executable shared memory here,
      # so this mount is nosuid but not noexec.
      - /tmp:rw,nosuid,size=536870912,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
      - seccomp=./scraper-worker/seccomp_profile.json
    cap_drop:
      - ALL
    cap_add:
      # Required by Chromium's user-namespace sandbox after clone/unshare.
      - SYS_CHROOT
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
    # A missing/weak secret exits with EX_CONFIG. Bound restarts so a
    # misconfigured optional worker fails closed instead of crash-looping.
    restart: "on-failure:3"
    networks:
      - scraper-egress

volumes:
  jobpilot-postgres:
  jobpilot-documents:

networks:
  # The browser worker is never attached to the database network. It can reach
  # the app and public vacancy sites through this separate egress network only.
  scraper-egress:
    driver: bridge
  database:
    driver: bridge
